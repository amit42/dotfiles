# ╔═══════════════════════════════════════════════════════╗
# ║  mpv.conf — managed via dotfiles                     ║
# ║  Edit: dotfiles/mpv/mpv.conf                         ║
# ║  Install: bash install.sh                            ║
# ╚═══════════════════════════════════════════════════════╝
#
# Used by the play/playv/music/musicv zsh functions. Reference:
# https://mpv.io/manual/stable/

# ── Terminal look ────────────────────────────────────────
# Colored log/status output (uses the terminal's ANSI palette, so it
# follows the active dotfiles theme like everything else)
msg-color=yes
# No separate full-width progress bar line — the pillbar.lua status
# line (audio-reactive pills + time) is the whole terminal UI
term-osd-bar=no
# Fallback status before pillbar.lua takes over
term-status-msg=${?pause==yes:⏸}${!pause==yes:▶} ${media-title}   ${time-pos} / ${duration}
# Suppress the startup clutter (track lists, File tags block, AO line) —
# warnings and errors still print
msg-level=cplayer=warn

# ── Video window (playv/musicv) ──────────────────────────
# OSD styled to match the terminal font
osd-font='JetBrainsMono Nerd Font'
osd-font-size=28
osd-border-size=1
# Don't grab focus fullscreen — open as a normal window
fullscreen=no
# Keep the window open a moment isn't needed; quit when done
keep-open=no

# ── Streaming quality ────────────────────────────────────
# Cap video at 1080p — starts faster, avoids 4K bandwidth for a
# background player. Audio-only (play/music) is unaffected.
ytdl-format=bestvideo[height<=1080]+bestaudio/best

# ── Resume ───────────────────────────────────────────────
# Remember position when you quit mid-track and resume on replay
save-position-on-quit=yes
