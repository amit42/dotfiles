# tmux theme — Rosé Pine
#   base = #191724   surface = #26233a   text = #e0def4
#   foam = #9ccfd8 (session pill)        muted = #6e6a86

set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left "#[bg=#9ccfd8,fg=#191724,bold] #S #[bg=#191724,fg=#9ccfd8] "
set -g status-right "#[fg=#6e6a86] %a %d %b  #[fg=#e0def4,bold]%H:%M "
setw -g window-status-format         "#[bg=#26233a,fg=#{?#{==:#I,1},#eb6f92,#{?#{==:#I,2},#f6c177,#{?#{==:#I,3},#ebbcba,#{?#{==:#I,4},#31748f,#{?#{==:#I,5},#9ccfd8,#{?#{==:#I,6},#c4a7e7,#{?#{==:#I,7},#56949f,#d7827e}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#eb6f92,#{?#{==:#I,2},#f6c177,#{?#{==:#I,3},#ebbcba,#{?#{==:#I,4},#31748f,#{?#{==:#I,5},#9ccfd8,#{?#{==:#I,6},#c4a7e7,#{?#{==:#I,7},#56949f,#d7827e}}}}}}},fg=#191724,bold] #W "
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#9ccfd8"
