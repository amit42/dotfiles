# tmux theme — Kanagawa Wave
#   base = #1f1f28   surface = #2a2a37   text = #dcd7ba
#   blue = #7e9cd8 (session pill)        overlay = #727169

set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left "#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[bg=#1f1f28,fg=#7e9cd8] "
set -g status-right "#[fg=#727169] %a %d %b  #[fg=#dcd7ba,bold]%H:%M "
setw -g window-status-format         "#[bg=#2a2a37,fg=#{?#{==:#I,1},#ff5d62,#{?#{==:#I,2},#ffa066,#{?#{==:#I,3},#e6c384,#{?#{==:#I,4},#98bb6c,#{?#{==:#I,5},#7aa89f,#{?#{==:#I,6},#957fb8,#{?#{==:#I,7},#7e9cd8,#d27e99}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#ff5d62,#{?#{==:#I,2},#ffa066,#{?#{==:#I,3},#e6c384,#{?#{==:#I,4},#98bb6c,#{?#{==:#I,5},#7aa89f,#{?#{==:#I,6},#957fb8,#{?#{==:#I,7},#7e9cd8,#d27e99}}}}}}},fg=#1f1f28,bold] #W "
set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#7e9cd8"
