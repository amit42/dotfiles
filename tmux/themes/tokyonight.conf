# tmux theme — TokyoNight Night
#   base = #1a1b26   surface = #292e42   text = #c0caf5
#   blue = #7aa2f7 (session pill)        overlay = #565f89

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7] "
set -g status-right "#[fg=#565f89] %a %d %b  #[fg=#c0caf5,bold]%H:%M "
setw -g window-status-format         "#[bg=#292e42,fg=#{?#{==:#I,1},#f7768e,#{?#{==:#I,2},#ff9e64,#{?#{==:#I,3},#e0af68,#{?#{==:#I,4},#9ece6a,#{?#{==:#I,5},#7dcfff,#{?#{==:#I,6},#bb9af7,#{?#{==:#I,7},#7aa2f7,#1abc9c}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#f7768e,#{?#{==:#I,2},#ff9e64,#{?#{==:#I,3},#e0af68,#{?#{==:#I,4},#9ece6a,#{?#{==:#I,5},#7dcfff,#{?#{==:#I,6},#bb9af7,#{?#{==:#I,7},#7aa2f7,#1abc9c}}}}}}},fg=#1a1b26,bold] #W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
