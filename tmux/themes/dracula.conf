# tmux theme — Dracula
#   base = #282a36   surface = #44475a   text = #f8f8f2
#   purple = #bd93f9 (session pill)      comment = #6272a4

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9] "
set -g status-right "#[fg=#6272a4] %a %d %b  #[fg=#f8f8f2,bold]%H:%M "
setw -g window-status-format         "#[bg=#44475a,fg=#{?#{==:#I,1},#ff5555,#{?#{==:#I,2},#ffb86c,#{?#{==:#I,3},#f1fa8c,#{?#{==:#I,4},#50fa7b,#{?#{==:#I,5},#8be9fd,#{?#{==:#I,6},#bd93f9,#{?#{==:#I,7},#ff79c6,#6272a4}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#ff5555,#{?#{==:#I,2},#ffb86c,#{?#{==:#I,3},#f1fa8c,#{?#{==:#I,4},#50fa7b,#{?#{==:#I,5},#8be9fd,#{?#{==:#I,6},#bd93f9,#{?#{==:#I,7},#ff79c6,#6272a4}}}}}}},fg=#282a36,bold] #W "
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
