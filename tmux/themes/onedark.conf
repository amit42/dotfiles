# tmux theme — One Dark (Atom)
#   base = #282c34   surface = #3e4451   text = #abb2bf
#   blue = #61afef (session pill)        comment = #5c6370

set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left "#[bg=#61afef,fg=#282c34,bold] #S #[bg=#282c34,fg=#61afef] "
set -g status-right "#[fg=#5c6370] %a %d %b  #[fg=#abb2bf,bold]%H:%M "
setw -g window-status-format         "#[bg=#3e4451,fg=#{?#{==:#I,1},#e06c75,#{?#{==:#I,2},#d19a66,#{?#{==:#I,3},#e5c07b,#{?#{==:#I,4},#98c379,#{?#{==:#I,5},#56b6c2,#{?#{==:#I,6},#c678dd,#{?#{==:#I,7},#61afef,#abb2bf}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#e06c75,#{?#{==:#I,2},#d19a66,#{?#{==:#I,3},#e5c07b,#{?#{==:#I,4},#98c379,#{?#{==:#I,5},#56b6c2,#{?#{==:#I,6},#c678dd,#{?#{==:#I,7},#61afef,#abb2bf}}}}}}},fg=#282c34,bold] #W "
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
