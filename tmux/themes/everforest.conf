# tmux theme — Everforest Dark
#   base = #2d353b   surface = #3d484d   text = #d3c6aa
#   green = #a7c080 (session pill)       grey = #859289

set -g status-style "bg=#2d353b,fg=#d3c6aa"
set -g status-left "#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=#2d353b,fg=#a7c080] "
set -g status-right "#[fg=#859289] %a %d %b  #[fg=#d3c6aa,bold]%H:%M "
setw -g window-status-format         "#[bg=#3d484d,fg=#{?#{==:#I,1},#e67e80,#{?#{==:#I,2},#e69875,#{?#{==:#I,3},#dbbc7f,#{?#{==:#I,4},#a7c080,#{?#{==:#I,5},#83c092,#{?#{==:#I,6},#d699b6,#{?#{==:#I,7},#7fbbb3,#9da9a0}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#e67e80,#{?#{==:#I,2},#e69875,#{?#{==:#I,3},#dbbc7f,#{?#{==:#I,4},#a7c080,#{?#{==:#I,5},#83c092,#{?#{==:#I,6},#d699b6,#{?#{==:#I,7},#7fbbb3,#9da9a0}}}}}}},fg=#2d353b,bold] #W "
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"
