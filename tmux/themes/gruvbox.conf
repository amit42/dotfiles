# tmux theme — Gruvbox Dark
#   base = #282828   surface = #3c3836   text = #ebdbb2
#   blue = #83a598 (session pill)        overlay = #928374

set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left "#[bg=#83a598,fg=#282828,bold] #S #[bg=#282828,fg=#83a598] "
set -g status-right "#[fg=#928374] %a %d %b  #[fg=#ebdbb2,bold]%H:%M "
setw -g window-status-format         "#[bg=#3c3836,fg=#{?#{==:#I,1},#fb4934,#{?#{==:#I,2},#fe8019,#{?#{==:#I,3},#fabd2f,#{?#{==:#I,4},#b8bb26,#{?#{==:#I,5},#8ec07c,#{?#{==:#I,6},#d3869b,#{?#{==:#I,7},#83a598,#d79921}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#fb4934,#{?#{==:#I,2},#fe8019,#{?#{==:#I,3},#fabd2f,#{?#{==:#I,4},#b8bb26,#{?#{==:#I,5},#8ec07c,#{?#{==:#I,6},#d3869b,#{?#{==:#I,7},#83a598,#d79921}}}}}}},fg=#282828,bold] #W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
