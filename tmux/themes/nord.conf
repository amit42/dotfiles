# tmux theme — Nord
#   base = #2e3440   surface = #3b4252   text = #d8dee9
#   frost = #88c0d0 (session pill)       overlay = #4c566a

set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440,fg=#88c0d0] "
set -g status-right "#[fg=#4c566a] %a %d %b  #[fg=#d8dee9,bold]%H:%M "
setw -g window-status-format         "#[bg=#3b4252,fg=#{?#{==:#I,1},#bf616a,#{?#{==:#I,2},#d08770,#{?#{==:#I,3},#ebcb8b,#{?#{==:#I,4},#a3be8c,#{?#{==:#I,5},#88c0d0,#{?#{==:#I,6},#b48ead,#{?#{==:#I,7},#81a1c1,#8fbcbb}}}}}}}] #W "
setw -g window-status-current-format "#[bg=#{?#{==:#I,1},#bf616a,#{?#{==:#I,2},#d08770,#{?#{==:#I,3},#ebcb8b,#{?#{==:#I,4},#a3be8c,#{?#{==:#I,5},#88c0d0,#{?#{==:#I,6},#b48ead,#{?#{==:#I,7},#81a1c1,#8fbcbb}}}}}}},fg=#2e3440,bold] #W "
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
