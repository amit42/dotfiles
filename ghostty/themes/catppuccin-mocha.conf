# Ghostty theme snippet — Catppuccin Mocha (the default)
# Deployed by install.sh as `theme-dotfiles.conf` next to the main config,
# which pulls it in via `config-file = theme-dotfiles.conf`.
theme = Catppuccin Mocha

# Explicit cursor + selection colors (match WezTerm) so highlights look
# identical across terminals.
cursor-color           = #cba6f7
selection-background   = #45475a
selection-foreground   = #cdd6f4
