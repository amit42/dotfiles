# ── Directory ────────────────────────────────────────────
[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = ""
fish_style_pwd_dir_length = 1

[directory.substitutions]
"/mnt/c/Users/amit97.kumar" = ""
"/mnt/c"                    = "C:"
"/mnt/d"                    = "D:"
"/mnt/e"                    = "E:"

# ── Git ──────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "mauve"
format = "[$symbol $branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'
ahead    = "⇡$count"
behind   = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
modified = "!"
staged   = "+"
untracked = "?"
deleted  = "✘"
stashed  = "~"

# ── Languages — only when files present ──────────────────
[python]
symbol = "py"
format = "[$symbol $version]($style) "
style = "yellow"
detect_files = ["*.py", "requirements.txt", "pyproject.toml", "setup.py", ".python-version"]
version_format = "$major.$minor"

[golang]
symbol = "go"
format = "[$symbol $version]($style) "
style = "sky"
detect_files = ["go.mod"]
version_format = "$major.$minor"

[rust]
symbol = "rs"
format = "[$symbol $version]($style) "
style = "peach"
detect_files = ["Cargo.toml"]
version_format = "$major.$minor"

[nodejs]
symbol = "node"
format = "[$symbol $version]($style) "
style = "green"
detect_files = ["package.json"]
version_format = "$major.$minor"

[c]
symbol = "c"
format = "[$symbol]($style) "
style = "sapphire"
detect_files = ["*.c", "*.h", "Makefile", "CMakeLists.txt"]

# ── DevOps — only in relevant dirs ───────────────────────
[aws]
symbol = "aws"
format = "[$symbol $profile]($style) "
style = "peach"

[kubernetes]
symbol = "k8s"
format = "[$symbol $context]($style) "
style = "teal"
disabled = false
detect_files   = ["*.yaml", "*.yml", "Chart.yaml", "kustomization.yaml", "helmfile.yaml"]
detect_folders = [".kube", "k8s", "kubernetes", "helm"]

# ── Right side ───────────────────────────────────────────
[cmd_duration]
min_time = 1_000
format = "[$duration]($style) "
style = "overlay"

[time]
disabled = false
format = "[$time]($style)"
style = "overlay"
time_format = "%H:%M"

# ── Prompt character ─────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold mauve)"

# ── Disable noisy modules ────────────────────────────────
[package]
disabled = true

[docker_context]
disabled = true
